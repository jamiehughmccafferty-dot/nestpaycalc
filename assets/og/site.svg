<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003087"/>
      <stop offset="100%" stop-color="#001f5e"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#00875a" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#00875a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="100" r="280" fill="url(#blob1)"/>
  <circle cx="80" cy="540" r="220" fill="url(#blob2)"/>

  <!-- Top bar: logo + tag -->
  <g transform="translate(64, 56)">
    <!-- Nest icon -->
    <g>
      <path d="M0 22 c0 -6 5.5 -10 12 -10 s12 4 12 10 v2 H0 z" fill="#ffffff"/>
      <text x="12" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800" fill="#003087" text-anchor="middle">£</text>
    </g>
    <text x="40" y="20" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">NestPayCalc</text>

    <!-- Tax-year pill -->
    <g transform="translate(880, -6)">
      <rect width="200" height="34" rx="17" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.22)"/>
      <text x="100" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">UK · TAX YEAR 2026/27</text>
    </g>
  </g>

  <!-- Mid: headline -->
  <g transform="translate(64, 260)">
    <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="rgba(255,255,255,0.72)" letter-spacing="2">FREE UK FINANCIAL CALCULATORS</text>
    <text y="80" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Accurate &amp; easy to use</text>
    <text y="130" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#hl)" letter-spacing="-2">— right down to the penny.</text>
  </g>

  <!-- Stats row -->
  <g transform="translate(64, 480)">
    <line x1="0" y1="0" x2="1072" y2="0" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <g transform="translate(0, 30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="1">SALARY</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Take-home pay</text>
    </g>
    <g transform="translate(280, 30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="1">MORTGAGE</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">SDLT · LBTT · LTT</text>
    </g>
    <g transform="translate(610, 30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="1">PENSION</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Drawdown forecast</text>
    </g>
    <g transform="translate(900, 30)">
      <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.65)" letter-spacing="1">+ MORE</text>
      <text y="32" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Savings · Debt · Budget</text>
    </g>
  </g>

  <!-- Footer URL -->
  <g transform="translate(64, 590)">
    <circle cx="6" cy="-5" r="6" fill="#34d399"/>
    <text x="22" y="0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">nestpaycalc.com</text>
  </g>
</svg>
